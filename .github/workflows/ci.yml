name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (npm build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps
      - name: Build
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  backend:
    name: Backend (cold install + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # 冷装验证：按 requirements.txt 从零安装（钉版漂移/API 断裂在这里暴露）
      - name: Cold install dependencies
        working-directory: ./backend
        run: |
          python -m venv .venv-ci
          .venv-ci/bin/pip install --no-cache-dir -r requirements.txt
      - name: Run tests (offline, degraded mode)
        working-directory: ./backend
        run: |
          .venv-ci/bin/python -m pytest -q
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./ci_test.db"
          JWT_SECRET: "ci-secret-not-for-production"
          LITELLM_API_KEY: ""
          ENV: "dev"
