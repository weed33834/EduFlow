# Alembic 迁移配置 — EduFlow API
# 数据库 URL 默认从环境变量 / core.config.settings 读取（见 alembic/env.py），
# 此处保留占位以兼容 Alembic 对配置项的读取。

[alembic]
script_location = alembic
prepend_sys_path = .
# 占位：实际连接串由 env.py 中 core.config.settings.DATABASE_URL 提供
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
