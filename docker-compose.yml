services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eduflow
      POSTGRES_PASSWORD: eduflow
      POSTGRES_DB: eduflow
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduflow"]
      interval: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  backend:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://eduflow:eduflow@postgres:5432/eduflow
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-https://api.openai.com/v1}
      LITELLM_MODEL: ${LITELLM_MODEL:-gpt-4o-mini}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      CORS_ORIGINS: http://localhost:3000
      E2B_API_KEY: ${E2B_API_KEY:-}
      QDRANT_URL: http://qdrant:6333
      MEM0_API_KEY: ${MEM0_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_started }

  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [backend]

volumes:
  pgdata:
  qdrant_data:
